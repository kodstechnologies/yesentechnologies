version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22 && node --version
        - npm install -g bun@1
        - bun install --frozen-lockfile
    build:
      commands:
        - AWS_AMPLIFY=1 bun run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
