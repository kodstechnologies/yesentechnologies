
name: Deploy Yesen Technologies

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yesentechnologies-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 15m
          envs: ENV_FILE
          script: |
            set -eu

            APP_DIR="/home/ubuntu/yesentechnologies"
            cd "$APP_DIR"

            echo "Restoring environment file..."
            test -n "$ENV_FILE"
            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Restoring environment file after Git update..."
            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env

            echo "Checking Node.js and pnpm..."
            node --version
            corepack enable

            echo "Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "Building frontend..."
            pnpm build

            echo "Restarting frontend service..."
            pm2 restart yesentechnologies --update-env

            echo "Checking Nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment completed."
