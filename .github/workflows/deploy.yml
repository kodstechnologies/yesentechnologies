
name: Deploy Yesen Technologies

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yesentechnologies-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 20m
          envs: ENV_FILE
          script: |
            set -eu

            APP_DIR="/home/ubuntu/yesentechnologies"
            cd "$APP_DIR"

            echo "Restoring production environment..."
            test -n "$ENV_FILE"
            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Restoring environment after Git update..."
            printf '%s\n' "$ENV_FILE" > .env
            chmod 600 .env

            echo "Building new Docker image..."
            sudo docker build --pull -t yesen:new .

            echo "Checking new image..."
            sudo docker image inspect yesen:new >/dev/null

            echo "Preparing rollback image..."
            if sudo docker image inspect yesen:previous >/dev/null 2>&1; then
              sudo docker image rm yesen:previous || true
            fi

            sudo docker tag yesen:latest yesen:previous 2>/dev/null || true
            sudo docker tag yesen:new yesen:latest

            echo "Replacing application container..."
            sudo docker stop yesen
            sudo docker rm yesen

            if ! sudo docker run -d \
              --name yesen \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              --env-file "$APP_DIR/.env" \
              yesen:latest; then

              echo "New container failed to start; attempting rollback..."

              sudo docker rm -f yesen 2>/dev/null || true

              if sudo docker image inspect yesen:previous >/dev/null 2>&1; then
                sudo docker run -d \
                  --name yesen \
                  --restart unless-stopped \
                  -p 127.0.0.1:8080:8080 \
                  --env-file "$APP_DIR/.env" \
                  yesen:previous
              fi

              exit 1
            fi

            echo "Waiting for application startup..."
            sleep 10

            if ! sudo docker ps --filter "name=^/yesen$" --filter "status=running" | grep -q yesen; then
              sudo docker logs --tail 100 yesen || true
              exit 1
            fi

            echo "Testing application..."
            if ! curl --fail --silent --show-error \
              http://127.0.0.1:8080/ -o /dev/null; then

              sudo docker logs --tail 100 yesen || true
              exit 1
            fi

            echo "Testing Nginx configuration..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment completed successfully."
